name: Temporary source export

on:
  push:
    branches:
      - automation/source-export

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack source
        run: tar --exclude=.git -czf "$RUNNER_TEMP/vf2-decomp-master.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: vf2-decomp-master
          path: ${{ runner.temp }}/vf2-decomp-master.tar.gz
          if-no-files-found: error
          retention-days: 1
