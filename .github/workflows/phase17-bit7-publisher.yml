name: Temporary phase17 bit7 publisher

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'automation/phase17-bit7-publish'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current master
        uses: actions/checkout@v4
        with:
          ref: master
          path: work
          fetch-depth: 0

      - name: Checkout validated patch transport
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: source

      - name: Reconstruct validated phase17 bit7 patch
        run: |
          echo "457bd1e0b72882d0fe203e6c152a5b7c62c1bcc9bb1b9c71614a9431f0c69a5d  source/automation/phase17-bit7.patch.b64.000" | sha256sum -c -
          echo "28602e56a64c1a2fec148d8926f581ec96d5ef5c6bb3f6e75f300a9a76dd677f  source/automation/phase17-bit7.patch.b64.001" | sha256sum -c -
          echo "af638e9b7b4fd06ae8f5b3abb5c9a0a40b34f995d2860ec066849c821f826b1a  source/automation/phase17-bit7.patch.b64.002" | sha256sum -c -
          echo "fee774c9c9907811e62c19a393ef52171ea53251ba41a25d3ff79bdc30c9e3e9  source/automation/phase17-bit7.patch.b64.003a" | sha256sum -c -
          echo "f1eb6b8718d64d921cdd4940481e9b2900fa3156c78ea24260a0d0a2841e74c3  source/automation/phase17-bit7.patch.b64.003b" | sha256sum -c -
          echo "ede1296d48be3423c9b4cd15924655469e3e2ade7d7814c3faab4193daf01a17  source/automation/phase17-bit7.patch.b64.004" | sha256sum -c -
          cat source/automation/phase17-bit7.patch.b64.000 \
              source/automation/phase17-bit7.patch.b64.001 \
              source/automation/phase17-bit7.patch.b64.002 \
              source/automation/phase17-bit7.patch.b64.003a \
              source/automation/phase17-bit7.patch.b64.003b \
              source/automation/phase17-bit7.patch.b64.004 \
              > /tmp/phase17-bit7.patch.b64
          base64 -d /tmp/phase17-bit7.patch.b64 > /tmp/phase17-bit7.patch
          echo "784f2a91dea420913cf5e31f884802130f3c3fbd851cbe55a4dad1f8c4fffffe  /tmp/phase17-bit7.patch" | sha256sum -c -
          git -C work apply --check /tmp/phase17-bit7.patch
          git -C work apply /tmp/phase17-bit7.patch
          git -C work diff --check

      - name: GCC warning-as-error build and tests
        working-directory: work
        env:
          CC: gcc
        run: |
          cmake -S . -B build-gcc -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DVF2_BUILD_TESTS=ON \
            -DVF2_WARNINGS_AS_ERRORS=ON \
            -DVF2_ROM_DIR=/tmp/no-proprietary-roms
          cmake --build build-gcc --parallel
          ctest --test-dir build-gcc --output-on-failure

      - name: Clang warning-as-error build and tests
        working-directory: work
        env:
          CC: clang
        run: |
          cmake -S . -B build-clang -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DVF2_BUILD_TESTS=ON \
            -DVF2_WARNINGS_AS_ERRORS=ON \
            -DVF2_ROM_DIR=/tmp/no-proprietary-roms
          cmake --build build-clang --parallel
          ctest --test-dir build-clang --output-on-failure

      - name: Publish directly to master
        working-directory: work
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/recovered/texture_bridge_match.c \
            tests/analysis/test_orchestrator_bridge.c \
            CHANGELOG.md README.md docs/STATUS.md docs/UNCOVERED_BRANCHES.md
          git commit -m "runtime: recover phase17 bit7 countdown"
          git push origin HEAD:master
