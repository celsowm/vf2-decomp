name: Temporary phase17 bit7 publisher

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'automation/phase17-bit7-publish'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current master
        uses: actions/checkout@v4
        with:
          ref: master
          path: work
          fetch-depth: 0

      - name: Checkout validated patch transport
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: source

      - name: Reconstruct validated phase17 bit7 patch
        run: |
          wc -c source/automation/phase17-bit7.patch.b64.000 \
                source/automation/phase17-bit7.patch.b64.001 \
                source/automation/phase17-bit7.patch.b64.002 \
                source/automation/phase17-bit7.patch.b64.003 \
                source/automation/phase17-bit7.patch.b64.004
          sha256sum source/automation/phase17-bit7.patch.b64.000 \
                    source/automation/phase17-bit7.patch.b64.001 \
                    source/automation/phase17-bit7.patch.b64.002 \
                    source/automation/phase17-bit7.patch.b64.003 \
                    source/automation/phase17-bit7.patch.b64.004
          cat source/automation/phase17-bit7.patch.b64.000 \
              source/automation/phase17-bit7.patch.b64.001 \
              source/automation/phase17-bit7.patch.b64.002 \
              source/automation/phase17-bit7.patch.b64.003 \
              source/automation/phase17-bit7.patch.b64.004 \
              > /tmp/phase17-bit7.patch.b64
          base64 -d /tmp/phase17-bit7.patch.b64 > /tmp/phase17-bit7.patch
          echo "784f2a91dea420913cf5e31f884802130f3c3fbd851cbe55a4dad1f8c4fffffe  /tmp/phase17-bit7.patch" | sha256sum -c -
          git -C work apply --check /tmp/phase17-bit7.patch
          git -C work apply /tmp/phase17-bit7.patch
          git -C work diff --check

      - name: GCC warning-as-error build and tests
        working-directory: work
        env:
          CC: gcc
        run: |
          cmake -S . -B build-gcc -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DVF2_BUILD_TESTS=ON \
            -DVF2_WARNINGS_AS_ERRORS=ON \
            -DVF2_ROM_DIR=/tmp/no-proprietary-roms
          cmake --build build-gcc --parallel
          ctest --test-dir build-gcc --output-on-failure

      - name: Clang warning-as-error build and tests
        working-directory: work
        env:
          CC: clang
        run: |
          cmake -S . -B build-clang -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DVF2_BUILD_TESTS=ON \
            -DVF2_WARNINGS_AS_ERRORS=ON \
            -DVF2_ROM_DIR=/tmp/no-proprietary-roms
          cmake --build build-clang --parallel
          ctest --test-dir build-clang --output-on-failure

      - name: Publish directly to master
        working-directory: work
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/recovered/texture_bridge_match.c \
            tests/analysis/test_orchestrator_bridge.c \
            CHANGELOG.md README.md docs/STATUS.md docs/UNCOVERED_BRANCHES.md
          git commit -m "runtime: recover phase17 bit7 countdown"
          git push origin HEAD:master
