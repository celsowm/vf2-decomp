name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.compiler }} release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
          - compiler: clang
            cc: clang
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v0.2 runtime patch to clean master
        run: |
          cp .github/apply-v02-kill-scheduler.py /tmp/apply-v02-kill-scheduler.py
          git fetch origin master
          git checkout -B validated-master origin/master
          python /tmp/apply-v02-kill-scheduler.py
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DVF2_BUILD_TESTS=ON
          -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Publish directly to master
        if: matrix.compiler == 'gcc'
        run: |
          git add src/recovered/native_runtime.c tests/recovered/test_native_runtime.c
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "runtime: handle dynamic late-sweep scheduling"
          git push origin HEAD:master

  sanitizers:
    name: clang ASan and UBSan
    runs-on: ubuntu-latest
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v0.2 runtime patch to clean master
        run: |
          cp .github/apply-v02-kill-scheduler.py /tmp/apply-v02-kill-scheduler.py
          git fetch origin master
          git checkout -B validated-master origin/master
          python /tmp/apply-v02-kill-scheduler.py
      - name: Configure
        run: >-
          cmake -S . -B build-asan -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DVF2_BUILD_TESTS=ON
          -DVF2_WARNINGS_AS_ERRORS=ON
          -DVF2_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build-asan --parallel
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-asan --output-on-failure
