name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tools:
    name: Python tooling syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile differential tools
        run: >-
          python3 -m py_compile
          decomp/i960/enumerate_game_info_18644.py
          decomp/i960/tools/*.py
          tools/python/*.py
      - name: Test frontier analysis
        run: python3 tools/python/test_frontier.py
      - name: Verify SCSP Timer-A opcode and interval (ROM-free)
        run: python3 tools/python/test_audio_scsp_tima_rom.py
      - name: Verify conservative M68000 IRQ cycle budget (ROM-free)
        run: python3 tools/python/test_audio_m68k_scheduler_budget.py

  build:
    name: ${{ matrix.compiler }} release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
          - compiler: clang
            cc: clang
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DVF2_BUILD_TESTS=ON
          -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Build boot quad-copy differential test
        run: >-
          $CC -std=c17 -Wall -Wextra -Wpedantic -Wconversion -Wshadow
          -Wstrict-prototypes -Werror -Iinclude
          tests/recovered/test_iac_reinitialize.c
          build/libvf2_core.a -lm -o build/vf2_iac_reinitialize_tests
      - name: Test boot quad-copy fail-closed paths
        run: build/vf2_iac_reinitialize_tests
      - name: Publish vf2i960 analysis binary
        if: matrix.compiler == 'gcc'
        uses: actions/upload-artifact@v4
        with:
          name: vf2i960-linux
          path: build/vf2i960
          if-no-files-found: error
      - name: Publish original-i960 audio writer replay tool
        if: matrix.compiler == 'gcc'
        uses: actions/upload-artifact@v4
        with:
          name: vf2-audio-writer-replay-linux
          path: build/vf2_audio_writer_replay
          if-no-files-found: error
      - name: Publish original sound ISR versus shadow differential
        if: matrix.compiler == 'gcc'
        uses: actions/upload-artifact@v4
        with:
          name: vf2-audio-isr-replay-linux
          path: build/vf2_audio_isr_replay
          if-no-files-found: error
      - name: Publish vf2cycles differential binary
        if: matrix.compiler == 'gcc'
        uses: actions/upload-artifact@v4
        with:
          name: vf2cycles-linux
          path: build/vf2cycles
          if-no-files-found: error
      - name: Publish object differential test binary
        if: matrix.compiler == 'gcc'
        uses: actions/upload-artifact@v4
        with:
          name: vf2-object-tests-linux
          path: build/vf2_object_handler_tests
          if-no-files-found: error
      - name: Publish boot quad-copy differential test binary
        if: matrix.compiler == 'gcc'
        uses: actions/upload-artifact@v4
        with:
          name: vf2-iac-copy-tests-linux
          path: build/vf2_iac_reinitialize_tests
          if-no-files-found: error
      - name: Publish sound CPU differential test binaries (no ROM)
        if: matrix.compiler == 'gcc'
        uses: actions/upload-artifact@v4
        with:
          name: vf2-m68k-sound-differential-linux
          path: |
            build/vf2_m68k_90_to_voice_tests
            build/vf2_m68k_l3_selection_tests
            build/vf2_m68k_90_ad_followup_tests
            build/vf2_m68k_cdispatch_tests
            build/vf2_m68k_frame342_dispatch_tests
            build/vf2_m68k_engine_copy_page_tests
          if-no-files-found: error

  sanitizers:
    name: clang ASan and UBSan
    runs-on: ubuntu-latest
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build-asan -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DVF2_BUILD_TESTS=ON
          -DVF2_WARNINGS_AS_ERRORS=ON
          -DVF2_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build-asan --parallel
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-asan --output-on-failure
      - name: Build boot quad-copy sanitizer test
        run: >-
          clang -std=c17 -Wall -Wextra -Wpedantic -Wconversion -Wshadow
          -Wstrict-prototypes -Werror -fsanitize=address,undefined
          -fno-omit-frame-pointer -Iinclude
          tests/recovered/test_iac_reinitialize.c
          build-asan/libvf2_core.a -lm -o build-asan/vf2_iac_reinitialize_tests
      - name: Test boot quad-copy sanitizer paths
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: build-asan/vf2_iac_reinitialize_tests

  windows:
    name: windows msvc release (non-blocking)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  host:
    name: sdl3 host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        # Linux: console build of SDL (no X11/Wayland headers on the runner);
        # the dummy video and audio drivers are all the host test needs.
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DVF2_BUILD_HOST=ON -DVF2_BUILD_TESTS=ON
          -DSDL_UNIX_CONSOLE_BUILD=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Host tests (dummy video and audio drivers, no ROM)
        run: ctest --test-dir build -C Release -R "vf2_host" --output-on-failure
      - name: Collect host package
        shell: bash
        run: |
          mkdir -p dist
          cp build/vf2_host* dist/ 2>/dev/null || true
          cp build/Release/vf2_host.exe dist/ 2>/dev/null || true
          cp README.md LICENSE docs/SCAFFOLDING.md dist/
          ls dist
      - name: Publish host package (no ROM, no assets)
        uses: actions/upload-artifact@v4
        with:
          name: vf2-host-${{ runner.os }}
          path: dist
          if-no-files-found: error
