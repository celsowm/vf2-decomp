name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-recovery-patch:
    name: Apply staged recovery patch
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/coin-scheduler-call-boundary'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Apply and commit recovery patch
        shell: bash
        run: |
          if git apply --check .github/recovery.patch; then
            git apply .github/recovery.patch
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/recovered/native_runtime.c src/recovered/texture_bridge_texture.c src/recovered/texture_bridge_match.c tools/vf2i960/commands.c
            git commit -m "runtime: recover COIN transition boundaries"
            git push origin HEAD:${{ github.head_ref }}
          else
            echo "Recovery patch already applied or no longer clean; leaving branch unchanged."
          fi

  python-tools:
    name: Python tooling syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile differential tools
        run: >-
          python3 -m py_compile
          decomp/i960/enumerate_game_info_18644.py
          decomp/i960/tools/*.py
          tools/python/*.py

  build:
    name: ${{ matrix.compiler }} release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
          - compiler: clang
            cc: clang
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DVF2_BUILD_TESTS=ON
          -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Publish analysis binaries and source
        if: matrix.compiler == 'gcc'
        uses: actions/upload-artifact@v4
        with:
          name: vf2-analysis-linux
          path: |
            build/vf2i960
            build/vf2probe
            CMakeLists.txt
            cmake
            include
            src
            tests
            tools
          if-no-files-found: error

  sanitizers:
    name: clang ASan and UBSan
    runs-on: ubuntu-latest
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build-asan -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DVF2_BUILD_TESTS=ON
          -DVF2_WARNINGS_AS_ERRORS=ON
          -DVF2_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build-asan --parallel
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-asan --output-on-failure
