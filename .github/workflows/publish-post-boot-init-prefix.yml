name: Temporary post-boot init prefix publisher

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'automation/post-boot-init-prefix'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current master
        uses: actions/checkout@v4
        with:
          ref: master
          path: work
          fetch-depth: 0

      - name: Checkout validated payload
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: source

      - name: Require validated base and apply patch
        run: |
          test "$(git -C work rev-parse HEAD)" = "951f5171dd0f1488adbb54698d1fbb4203e7b36d"
          git -C work apply --check ../source/automation/post-boot-init-prefix.patch
          git -C work apply ../source/automation/post-boot-init-prefix.patch
          git -C work diff --check

      - name: GCC warning-as-error build and tests
        working-directory: work
        env:
          CC: gcc
        run: |
          cmake -S . -B build-gcc -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DVF2_BUILD_TESTS=ON \
            -DVF2_WARNINGS_AS_ERRORS=ON \
            -DVF2_ROM_DIR=/tmp/no-proprietary-roms
          cmake --build build-gcc --parallel
          ctest --test-dir build-gcc --output-on-failure

      - name: Clang warning-as-error build and tests
        working-directory: work
        env:
          CC: clang
        run: |
          cmake -S . -B build-clang -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DVF2_BUILD_TESTS=ON \
            -DVF2_WARNINGS_AS_ERRORS=ON \
            -DVF2_ROM_DIR=/tmp/no-proprietary-roms
          cmake --build build-clang --parallel
          ctest --test-dir build-clang --output-on-failure

      - name: Commit directly to master
        working-directory: work
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md README.md docs/STATUS.md docs/UNCOVERED_BRANCHES.md \
                  include/vf2/native_runtime.h src/recovered/native_runtime.c \
                  tests/recovered/test_native_runtime.c
          git commit -m "runtime: recover post-boot init prefix"
          git push origin HEAD:master
