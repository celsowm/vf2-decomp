name: Apply phase17 zero recovery

on:
  push:
    branches: [automation/phase17-zero-20260811]
    paths: [.github/phase17-zero-ready]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          ref: automation/phase17-zero-20260811
          path: infra
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          path: repo
      - name: Verify base and apply patches
        run: |
          cd repo
          test "$(git rev-parse HEAD)" = "dabc70d531d4abf122720b9f858b415714c4ec9f"
          for patch in ../infra/.github/phase17-zero-patches/*.patch; do
            git apply --check "$patch"
            git apply "$patch"
          done
          cp ../infra/.github/phase17-zero-files/test_phase17_zero.c tests/recovered/test_phase17_zero.c
          git diff --check
      - name: GCC release
        run: |
          cd repo
          CC=gcc cmake -S . -B build-gcc -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
          cmake --build build-gcc --parallel
          ctest --test-dir build-gcc --output-on-failure
      - name: Clang release
        run: |
          cd repo
          CC=clang cmake -S . -B build-clang -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
          cmake --build build-clang --parallel
          ctest --test-dir build-clang --output-on-failure
      - name: Clang sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cd repo
          CC=clang cmake -S . -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON -DVF2_ENABLE_SANITIZERS=ON
          cmake --build build-asan --parallel
          ctest --test-dir build-asan --output-on-failure
      - name: Commit to master
        run: |
          cd repo
          git config user.name "Celso Fontes"
          git config user.email "celsowm@users.noreply.github.com"
          git add -A
          git commit -m "Recover phase-17 zero-state control test"
          git push origin HEAD:master
