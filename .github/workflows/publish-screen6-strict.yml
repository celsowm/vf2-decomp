name: Publish screen6 strict

on:
  push:
    branches:
      - work/screen6-strict-clean
    paths:
      - .github/workflows/publish-screen6-strict.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout control branch
        uses: actions/checkout@v4
        with:
          path: control
      - name: Checkout exact master
        uses: actions/checkout@v4
        with:
          ref: master
          path: target
          fetch-depth: 0
      - name: Verify base and apply candidate
        run: |
          test "$(git -C target rev-parse HEAD)" = "226f88ed26469c8634a579c65459f28be388fb21"
          cp control/.scratch/apply_screen6_strict.py target/.scratch/apply_screen6_strict.py
          cd target
          python3 .scratch/apply_screen6_strict.py
          git diff --check
          test "$(git status --short | grep -v '^?? .scratch/apply_screen6_strict.py$' | wc -l)" -eq 2
          rm .scratch/apply_screen6_strict.py
      - name: Build and test
        run: |
          cmake -S target -B target/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DVF2_BUILD_TESTS=ON \
            -DVF2_WARNINGS_AS_ERRORS=ON
          cmake --build target/build --parallel
          ctest --test-dir target/build --output-on-failure
      - name: Commit to master
        working-directory: target
        run: |
          git config user.name "celsowm"
          git config user.email "celsowm@gmail.com"
          git add src/recovered/texture_bridge_match.c tests/recovered/test_phase17_zero.c
          git commit -m "Recover strict phase17 camera position2 controls"
          git push origin HEAD:master
