name: Phase17 scratch artifact

on:
  push:
    branches:
      - work/phase17-copro-oracle

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply staged changes
        run: |
          git apply --check .scratch/phase17-copro.patch
          git apply .scratch/phase17-copro.patch
          python3 .scratch/apply_phase17_test.py
          git diff --check
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build differential tools
        run: cmake --build build --target vf2_phase17_zero_tests vf2_tgp_tests vf2i960 --parallel 2
      - name: Build copro probes
        run: |
          cc -std=c17 -Wall -Wextra -Werror -Iinclude tests/recovered/probe_phase17_copro.c build/libvf2_core.a -lm -o build/vf2_phase17_copro_probe
          cc -std=c17 -Wall -Wextra -Werror -Iinclude tests/recovered/probe_phase17_copro_matrix.c build/libvf2_core.a -lm -o build/vf2_phase17_copro_matrix_probe
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: phase17-linux-x64
          path: |
            build/vf2_phase17_zero_tests
            build/vf2_phase17_copro_probe
            build/vf2_phase17_copro_matrix_probe
            build/vf2_tgp_tests
            build/vf2i960
