name: Phase17 material polygon publish

on:
  push:
    branches:
      - work/phase17-next-lab

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve proven transforms
        run: |
          cp .scratch/apply_phase17_material_polygon.py /tmp/apply_phase17_material_polygon.py
          cp .scratch/apply_phase17_easy_tests.py /tmp/apply_phase17_easy_tests.py
      - name: Build clean commit
        run: |
          git fetch origin work/phase17-material-polygon-clean
          git checkout -B work/phase17-material-polygon-clean origin/work/phase17-material-polygon-clean
          python3 /tmp/apply_phase17_material_polygon.py
          python3 /tmp/apply_phase17_easy_tests.py
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' src/recovered/texture_bridge_match.c tests/recovered/test_phase17_zero.c | sort)"
          test "$changed" = "$expected"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/recovered/texture_bridge_match.c tests/recovered/test_phase17_zero.c
          git commit -m "Recover material and polygon test controls"
          git push origin HEAD:work/phase17-material-polygon-clean
