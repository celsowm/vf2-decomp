name: Export current v0.1.2 master source

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Package source
        run: git archive --format=zip --output=/tmp/vf2-decomp-master-v012.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: vf2-decomp-master-v012
          path: /tmp/vf2-decomp-master-v012.zip
          if-no-files-found: error
