name: Probe game-info state4 bit14+bit15
on:
  pull_request:
    branches: [master]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Upload current native candidate
        uses: actions/upload-artifact@v4
        with:
          name: vf2i960-state4-bit14-bit15-current
          path: build/vf2i960
          if-no-files-found: error
