name: source v0272 current

on:
  push:
    branches: [chatgpt/source-v0272-current]

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
      - name: Pack source
        run: tar --exclude=.git --exclude=vf2-master-source.tar.gz -czf vf2-master-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: vf2-master-source
          path: vf2-master-source.tar.gz
