name: Temporary boundary probe publisher

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'automation/source-bundle-next'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current master
        uses: actions/checkout@v4
        with:
          ref: master
          path: work
          fetch-depth: 0

      - name: Checkout staged integration
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: source

      - name: Decode and apply validated patch
        run: |
          base64 -d source/automation/boundary-probe.patch.gz.b64 | gzip -d > /tmp/boundary-probe.patch
          echo '570541ddd630a4bd26238fa066c0a9f038f974925c222e10748d14c1289142fb  /tmp/boundary-probe.patch' | sha256sum -c -
          git -C work apply --check /tmp/boundary-probe.patch
          git -C work apply /tmp/boundary-probe.patch
          git -C work diff --check

      - name: GCC warning-as-error build and tests
        working-directory: work
        env:
          CC: gcc
        run: |
          cmake -S . -B build-gcc -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DVF2_BUILD_TESTS=ON \
            -DVF2_WARNINGS_AS_ERRORS=ON \
            -DVF2_ROM_DIR=/tmp/no-proprietary-roms
          cmake --build build-gcc --parallel
          ctest --test-dir build-gcc --output-on-failure

      - name: Clang warning-as-error build and tests
        working-directory: work
        env:
          CC: clang
        run: |
          cmake -S . -B build-clang -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DVF2_BUILD_TESTS=ON \
            -DVF2_WARNINGS_AS_ERRORS=ON \
            -DVF2_ROM_DIR=/tmp/no-proprietary-roms
          cmake --build build-clang --parallel
          ctest --test-dir build-clang --output-on-failure

      - name: Commit directly to master
        working-directory: work
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/recovered/native_differential.c \
            tools/vf2cycles/main.c \
            tests/recovered/test_native_differential.c \
            README.md docs/STATUS.md CHANGELOG.md
          git commit -m "runtime: add resumable cycle-boundary probes"
          git push origin HEAD:master
