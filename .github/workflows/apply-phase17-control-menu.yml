name: Apply phase17 control menu

on:
  push:
    branches: [automation/source-bundle-phase17-next]
    paths: [.github/phase17-control-menu-ready]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          ref: automation/source-bundle-phase17-next
          path: infra
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          path: repo
      - name: Verify base and apply patch
        run: |
          cd repo
          test "$(git rev-parse HEAD)" = "31fea035ddfa87d028feea79cf6637bba47c1762"
          cat ../infra/.github/phase17-control-menu-patch/part*.b64 | base64 -d | gzip -d > /tmp/phase17-control-menu.patch
          echo "ac578b57675e946898dcab2eab85dbb953fdefe6428b8d014e1bf5ff9260182f  /tmp/phase17-control-menu.patch" | sha256sum -c -
          git apply --check /tmp/phase17-control-menu.patch
          git apply /tmp/phase17-control-menu.patch
          git diff --check
          git diff --name-only | sort > /tmp/changed-files
          printf '%s\n' CHANGELOG.md docs/STATUS.md docs/UNCOVERED_BRANCHES.md src/recovered/texture_bridge_match.c tests/recovered/test_phase17_zero.c | sort | diff -u - /tmp/changed-files
      - name: GCC release
        run: |
          cd repo
          CC=gcc cmake -S . -B build-gcc -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
          cmake --build build-gcc --parallel
          ctest --test-dir build-gcc --output-on-failure
      - name: Clang release
        run: |
          cd repo
          CC=clang cmake -S . -B build-clang -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
          cmake --build build-clang --parallel
          ctest --test-dir build-clang --output-on-failure
      - name: Clang sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cd repo
          CC=clang cmake -S . -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON -DVF2_ENABLE_SANITIZERS=ON
          cmake --build build-asan --parallel
          ctest --test-dir build-asan --output-on-failure
      - name: Commit to master
        run: |
          cd repo
          git config user.name "Celso Fontes"
          git config user.email "celsowm@users.noreply.github.com"
          git add CHANGELOG.md docs/STATUS.md docs/UNCOVERED_BRANCHES.md src/recovered/texture_bridge_match.c tests/recovered/test_phase17_zero.c
          git commit -m "Expand phase-17 zero-state control menu"
          git push origin HEAD:master
