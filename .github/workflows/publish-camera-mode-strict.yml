name: Publish camera mode strict

on:
  push:
    branches:
      - work/camera-mode-strict
    paths:
      - .github/workflows/publish-camera-mode-strict.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
      - uses: actions/checkout@v4
        with:
          ref: master
          path: target
          fetch-depth: 0
      - name: Apply on exact base
        run: |
          test "$(git -C target rev-parse HEAD)" = "6125882d2ae941cad713484839347357c95b3ec6"
          cd target
          python3 ../control/.scratch/apply_camera_mode_strict.py
          git diff --check
          test "$(git status --short | wc -l)" -eq 2
      - name: Build and test
        run: |
          cmake -S target -B target/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DVF2_BUILD_TESTS=ON \
            -DVF2_WARNINGS_AS_ERRORS=ON
          cmake --build target/build --parallel
          ctest --test-dir target/build --output-on-failure
      - name: Commit to master
        working-directory: target
        run: |
          git config user.name "celsowm"
          git config user.email "celsowm@gmail.com"
          git add src/recovered/texture_bridge_match.c tests/recovered/test_phase17_zero.c
          git commit -m "Recover strict phase17 camera mode controls"
          git push origin HEAD:master
