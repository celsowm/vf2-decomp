name: Temporary phase17 forward publisher

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'automation/phase17-forward'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current master
        uses: actions/checkout@v4
        with:
          ref: master
          path: work
          fetch-depth: 0

      - name: Checkout staged recovery
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: source

      - name: Decode and apply validated patch
        run: |
          base64 -d source/automation/phase17-forward.patch.gz.b64 | gzip -d > /tmp/phase17-forward.patch
          echo '998e61860bac9230d85797b21508c80a89b41d8342063f5df3ee13d20058a1bf  /tmp/phase17-forward.patch' | sha256sum -c -
          git -C work apply --check /tmp/phase17-forward.patch
          git -C work apply /tmp/phase17-forward.patch
          git -C work diff --check

      - name: GCC warning-as-error build and tests
        working-directory: work
        env:
          CC: gcc
        run: |
          cmake -S . -B build-gcc -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DVF2_BUILD_TESTS=ON \
            -DVF2_WARNINGS_AS_ERRORS=ON \
            -DVF2_ROM_DIR=/tmp/no-proprietary-roms
          cmake --build build-gcc --parallel
          ctest --test-dir build-gcc --output-on-failure

      - name: Clang warning-as-error build and tests
        working-directory: work
        env:
          CC: clang
        run: |
          cmake -S . -B build-clang -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DVF2_BUILD_TESTS=ON \
            -DVF2_WARNINGS_AS_ERRORS=ON \
            -DVF2_ROM_DIR=/tmp/no-proprietary-roms
          cmake --build build-clang --parallel
          ctest --test-dir build-clang --output-on-failure

      - name: Commit directly to master
        working-directory: work
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/recovered/texture_bridge_match.c \
            tests/analysis/test_orchestrator_bridge.c \
            README.md docs/STATUS.md docs/UNCOVERED_BRANCHES.md CHANGELOG.md
          git commit -m "runtime: recover phase17 forward branch"
          git push origin HEAD:master
