name: Phase17 next lab

on:
  push:
    branches:
      - work/phase17-next-lab

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build core
        run: cmake --build build --target vf2_phase17_zero_tests --parallel 2
      - name: Build next probe
        run: cc -std=c17 -Wall -Wextra -Werror -Iinclude tests/recovered/probe_phase17_next.c build/libvf2_core.a -lm -o build/vf2_phase17_next_probe
      - name: Upload probe and sources
        uses: actions/upload-artifact@v4
        with:
          name: phase17-next-linux-x64
          path: |
            build/vf2_phase17_next_probe
            src/recovered/native_runtime.c
            src/recovered/texture_bridge_match.c
