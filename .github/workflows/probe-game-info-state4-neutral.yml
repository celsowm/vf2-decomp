name: Probe game-info neutral state4
on:
  pull_request:
    branches: [master]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply state4 dispatcher edits
        run: python3 decomp/i960/tools/apply_exact_edits.py decomp/i960/patches/game_info_state4_neutral_semantic_edits.json
      - name: Apply zero-state compare correction
        run: python3 decomp/i960/tools/apply_exact_edits.py decomp/i960/patches/game_info_zero_state_compare_edits.json
      - name: Fix 0x18144 LDA table semantics
        run: python3 decomp/i960/tools/apply_exact_edits.py decomp/i960/patches/game_info_18144_lda_1f8_edits.json
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Upload corrected candidate
        uses: actions/upload-artifact@v4
        with:
          name: vf2i960-state4-neutral-final
          path: |
            build/vf2i960
            decomp/i960/tools/diagnose_game_info_pair.py
            decomp/i960/tools/validate_game_info_pair.py
            decomp/i960/tools/run_game_info_child.py
            decomp/i960/tools/game_info_18644_common.py
            decomp/i960/tools/compare_snapshot_counters.py
          if-no-files-found: error
      - name: Publish clean source candidate
        run: |
          cp src/recovered/hybrid.c /tmp/hybrid.c
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git switch -C recover-game-info-state4-neutral origin/master
          cp /tmp/hybrid.c src/recovered/hybrid.c
          git add src/recovered/hybrid.c
          git commit -m "candidate: recover neutral state4 game-info path"
          git push --force-with-lease origin recover-game-info-state4-neutral
